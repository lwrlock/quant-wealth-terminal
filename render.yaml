services:
  - type: web
    name: furkan-finans-terminal
    env: python
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: MASTER_PIN
        sync: false
      - key: SESSION_SECRET
        sync: false
